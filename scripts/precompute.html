<!doctype html><html lang="en"><meta charset="utf-8"><title>Harf offline geometry compiler</title><h1>Recompute lesson points</h1><p>This offline authoring utility uses the original SVG sampling and fitting rules. It does not approve model geometry.</p><button id="save">Download lessons.json</button><script type="module">import {catalog} from './authoring.js';document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(catalog,null,2)+'\n'],{type:'application/json'}));a.download='lessons.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></html>
