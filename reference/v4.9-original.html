.qword{font-family:HarfNaskh,"Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;letter-spacing:0;font-weight:400;line-height:1.9;display:inline-block;white-space:nowrap;padding:.12em .2em}.qhero .hero-art{overflow:visible;padding:16px 25px;min-width:0;flex-direction:column}.qhero .hero-art:before{width:230px;height:230px}.qhero .qword{position:relative;font-size:110px;color:var(--green);max-width:100%}.qhero .reference-caption{position:relative;font-size:12px;color:var(--muted);margin-top:-12px;text-align:center;max-width:100%;padding:0 10px}.qhero .hero-copy h2{max-width:440px;font-size:30px}.qhero{grid-template-columns:1.1fr .8fr;overflow:visible}.journey-overview{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 25px;color:var(--muted);font-size:12px}.journey-overview .tiny-dot{width:5px;height:5px;border-radius:50%;background:var(--primary)}.journeygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.journeycard{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:20px;display:flex;flex-direction:column;gap:13px;position:relative;min-width:0}.journeycard:hover{border-color:var(--primary)}.journeycard .stage-preview{height:95px;color:var(--green);background:var(--paper);border-radius:14px;display:flex;align-items:center;justify-content:center}.journeycard .stage-preview svg{height:90px;width:100%}.journeycard h3{font-size:16px}.journeycard p{font-size:12px;color:var(--muted);min-height:52px}.journeycard .stage-index{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.journeycard .number{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:700}.journeycard .number.finished{background:var(--mint);color:var(--green);border-color:var(--primary)}.journeycard .stage-bottom{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--green);margin-top:auto}.journey-intro{padding:25px 30px;background:var(--paper);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:20px;margin:20px 0}.journey-intro .qword{font-size:105px;text-align:center;color:var(--green)}.journey-intro h1{font-size:35px;margin:10px 0}.journey-intro p{color:var(--muted);font-size:13px;max-width:550px}.source-line{font-size:12px;color:var(--muted);margin:12px 0;line-height:1.6}.source-line bdi{font-variant-numeric:tabular-nums}.review-note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 16px;font-size:12px;color:var(--muted);margin:18px 0}.review-note svg{width:16px;height:16px;flex:none;margin-top:2px}.context-reference{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px;margin-top:14px}.context-reference .qword{font-size:40px;display:block;text-align:center;line-height:1.7;padding:7px 10px}.context-reference p{font-size:12px;color:var(--muted)}.context-header{display:flex;align-items:center;gap:10px;padding:8px 15px;border:1px solid var(--line);border-radius:15px;background:var(--surface);margin-bottom:10px;min-height:64px}.context-header .qword{font-size:32px;line-height:1.35;flex:none;padding:4px 8px}.context-header p{font-size:12px;color:var(--muted);line-height:1.5}.wordmodel{width:100%;height:210px;color:var(--green);background:var(--paper);border-radius:16px;margin:12px 0}.context-header .q-separator{height:30px;width:1px;background:var(--line);margin-inline:5px}.current-stroke-name{font-size:12px;font-weight:600;color:var(--green);padding-top:8px;min-height:28px}.specimen-word{min-width:0}.review-chip{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}.piece-preview{width:100%;height:auto;aspect-ratio:4/5;display:block;border-radius:16px;border:1px solid var(--line);margin:12px 0 18px}.piece-options{display:flex;gap:8px;flex-wrap:wrap}.piece-options button{min-height:48px;flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;font-size:12px;padding:9px 14px}.piece-options button.active{background:var(--mint);border-color:var(--primary);color:var(--green)}.completed-study{font-size:12px;color:var(--green);display:inline-flex;gap:6px;align-items:center}.completed-study svg{width:14px;height:14px}.journal-link{padding:22px 24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:26px}.journal-link p{font-size:12px;color:var(--muted)}.gallerycard .piece-tag{font-size:12px;color:var(--green);margin-top:7px}.q-progress{max-width:460px}.q-progress .progressbar{background:var(--line);height:5px}.journey-title-row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.review-modal p+p{margin-top:14px}.font-license{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;max-height:300px;overflow:auto;background:var(--soft);border-radius:15px;padding:15px}
