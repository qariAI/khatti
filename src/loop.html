<!doctype html>
<html lang="en" dir="ltr" data-khatti-lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4e9">
<title>Harf Loop</title>
<style>
:root{color-scheme:light;--paper:#f6f4e9;--ink:#143b33;--muted:#4e675e;--line:#d6e0d2;--gold:#f9d593;--mist:#e0fce7;--forest:#103a34}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 60% 5%,#fffdf6 0%,transparent 63%),var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button,select{touch-action:manipulation}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #4a806b;outline-offset:4px}
button{cursor:pointer}
button:disabled{cursor:default}
.top{max-width:980px;margin:auto;padding:24px clamp(16px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:Georgia,serif;font-size:25px;line-height:1;letter-spacing:-.035em}
.mark{font:700 23px/1.33 system-ui,sans-serif;width:34px;height:34px;text-align:center;color:var(--mist);background:#236251;border-radius:11px 11px 11px 4px}
.language{max-width:115px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fffdf6;font-size:13px}
main{width:min(100%,580px);margin:0 auto;padding:22px clamp(12px,4vw,25px) 28px}
.journey{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:39px;gap:8px}
.level{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fffdf6;font-size:13px;max-width:66%}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.dock{position:relative;display:grid;place-items:center;isolation:isolate;border-radius:24px;width:100%;height:clamp(270px,53svh,475px);padding:18px;background:radial-gradient(ellipse at 48% 35%,#22554b,#103a34 77%);border:1px solid #0d3831;box-shadow:0 18px 36px -18px #0c332c99,inset 0 1px #d1f2db31;overflow:hidden}
.dock::before{content:"";position:absolute;inset:8px;pointer-events:none;border:1px solid #b2d6bf21;border-radius:17px}
.board{position:relative;direction:ltr;display:grid;isolation:isolate;background:#173f37;--grid-line:#bce7c238}
.cell{position:relative;min-width:0;min-height:0;border:0;padding:0;background:none;outline-offset:-3px}
.cell::before{content:"";position:absolute;z-index:-1;inset:0;border-top:1px solid var(--grid-line);border-left:1px solid var(--grid-line)}
.cell.edge-right::before{border-right:1px solid var(--grid-line)}
.cell.edge-bottom::before{border-bottom:1px solid var(--grid-line)}
.tile{isolation:isolate;z-index:0}
.tile::before{z-index:auto;pointer-events:none}
.tile:hover::before{background:#c7f2cc14}
.tile:active::before{background:#e0fac931}
.tile:focus-visible{z-index:4;outline:2px solid #f5dfaa}
.stroke{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:transform .24s cubic-bezier(.24,.76,.28,1),filter .34s;transform-origin:center center}
.tile.linked .stroke{filter:drop-shadow(0 0 3px #b7f1c679)}
.tile.hint{z-index:3}
.tile.hint::after{position:absolute;inset:2px;border:2px solid var(--gold);border-radius:7px;content:"";pointer-events:none;animation:hint-pulse .68s ease-in-out 3}
.reveal{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .66s .24s ease}
.board.solved .reveal{opacity:1;animation:gold-pulse 1.6s .20s ease-out both}
.board.solved .tile::before{background:none}
@keyframes hint-pulse{0%,100%{opacity:.66;box-shadow:inset 0 0 3px #f6d89c45}50%{opacity:1;box-shadow:inset 0 0 14px #f6d89c8a}}
@keyframes gold-pulse{0%{opacity:0}48%{opacity:1;filter:drop-shadow(0 0 11px #ffd77dcb)}100%{opacity:1;filter:drop-shadow(0 0 3px #ffdf8838)}}
.below{text-align:center;padding:17px 0 0}
h1{font:400 clamp(28px,5vw,38px)/1.15 Georgia,system-ui,serif;margin:0}
html[lang="ar"] h1{font-family:system-ui,sans-serif;font-weight:600}
.prompt{color:var(--muted);margin:6px 0 16px;min-height:22px;font-size:14px}
.score{margin:0 0 14px;color:var(--muted);font-size:13px}
.stars{color:#866021;letter-spacing:.12em;font-size:18px;line-height:1.3}
.master-caption{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.master-badge{display:inline-block;color:#866021;background:#fff3d6;border:1px solid #d8b66d;border-radius:999px;padding:3px 8px;font:600 12px/1.3 system-ui,sans-serif;white-space:nowrap}
.finish{text-align:center;padding:26px 18px;color:var(--mist);border-radius:24px;background:radial-gradient(ellipse at 48% 35%,#22554b,#103a34 77%)}
.finish h1{color:#fffdf6}
.alphabet{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:24px auto;color:var(--gold);font-size:clamp(22px,6vw,38px);line-height:1.45}
.finish p{margin:8px 0 0}
.finish .action{background:#fffdf6;color:var(--ink)}
.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px}
.action{padding:9px 16px;min-height:42px;border:1px solid var(--line);border-radius:13px;background:#fffdf6;display:inline-flex;align-items:center;gap:7px}
.action:hover{background:#eaf2e6}
.action:disabled{opacity:.5}
.action.primary{background:#236251;color:#fff;border-color:#236251}
[hidden]{display:none!important}
@media(max-height:680px){.top{padding-block:13px}main{padding-top:13px}.below{padding-top:12px}}
@media(max-width:380px){.dock{padding:13px}.brand{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-delay:0ms!important;transition-delay:0ms!important}}

.pickers .level{max-width:none;min-width:0;width:50%}
.count{flex:0 0 100%;text-align:end}
.dock.master-board{height:max(clamp(270px,53svh,475px),calc(var(--master-board-ink-height) + 38px))}
@media(max-width:380px){.dock.master-board{padding:11px}}
.unlock-banner{color:#236251;margin:-5px 0 12px;font-size:14px}
.hint-note{margin:-5px 0 10px;color:var(--muted);font-size:13px}
.collection-content{margin:18px auto 22px}
.letter-collection{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.collection-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;list-style:none;margin:0;padding:0;direction:inherit}
.word-collection{display:grid;grid-template-columns:repeat(auto-fit,minmax(67px,1fr));gap:5px;list-style:none;margin:0;padding:0;direction:rtl}
.collect-cell{display:grid;align-content:center;min-height:42px;min-width:0;border:3px double transparent;border-radius:7px;background:#ffffff0b;color:#b9cfc4;font-size:20px;line-height:1.3;padding:3px;opacity:.64}
.collect-cell small{font:11px/1.2 system-ui,sans-serif;direction:ltr;overflow-wrap:anywhere}
.collect-cell.earned{color:var(--gold);opacity:1}
.collect-cell.framed{position:relative;border-color:#e8b86b;box-shadow:0 0 6px #ffdf8840,inset 0 0 6px #ffdf8840}
.collect-cell.framed::before,.collect-cell.framed::after{content:"";position:absolute;width:4px;height:4px;background:var(--gold);transform:rotate(45deg)}
.collect-cell.framed::before{inset-block-start:1px;inset-inline-start:1px}
.collect-cell.framed::after{inset-block-end:1px;inset-inline-end:1px}
.collect-cell.unavailable{background:none}
@media(max-width:480px){.top{flex-wrap:wrap;column-gap:10px;row-gap:7px}.top-controls{justify-content:flex-start}.hud-count{font-size:12px}}
</style>

  </div>
</section>

</section>

    return cell;
  }

}

function mod4(n){return (n + 4) % 4;}
function scrambled(index, seed=Math.imul(index+1, 0x9e3779b1), byPosition=false){
  const tiles=active.t;
  const dateSeed=seed;
  const turns=tiles.map(tile=>{
    if(byPosition)seed=dateSeed ^ Math.imul(tile[0]+1,0x85ebca6b) ^ Math.imul(tile[1]+1,0xc2b2ae35);
    seed ^= seed << 13;
    seed ^= seed >>> 17;
    seed ^= seed << 5;
    return (seed >>> 0) % tile[3];
  });
  const changeable = tiles.map((tile,i)=>tile[3]>1?i:-1).filter(i=>i>=0);
  const minimum = Math.min(changeable.length, Math.max(1, Math.ceil(changeable.length*(index<5?.45:.62))));
  let wrong = turns.filter(Boolean).length;
  for (const i of changeable) {
    if (wrong >= minimum) break;
    if (!turns[i]) {turns[i]=1;wrong++;}
  }
  return turns;
}
// Compare alpha masks rather than edges alone, so isolated dots still have
// to face the right way. Subpixel fragments and near-identical turns can be ignored.
function acceptableTurns(canvas){
  const {data}=canvas.getContext('2d').getImageData(0,0,sourceCell,sourceCell);
  const length=sourceCell*sourceCell, last=sourceCell-1;
  let ink=0;
  const difference=[0,0,0];
  for(let y=0;y<sourceCell;y++) for(let x=0;x<sourceCell;x++){
    const a=data[(y*sourceCell+x)*4+3];
    ink+=a;
    difference[0]+=Math.abs(a-data[((last-x)*sourceCell+y)*4+3]);
    difference[1]+=Math.abs(a-data[((last-y)*sourceCell+last-x)*4+3]);
    difference[2]+=Math.abs(a-data[(x*sourceCell+last-y)*4+3]);
  }
  const max=length*255;
  if (ink<=max*.0075) return [true,true,true,true];
  return [true,...difference.map(value=>value<=max*.015 || value<=ink*.025)];
}
function isCorrect(turn,i){return pieces[i].accepts[turn%4];}

function minimumTurns(){
  return angle.reduce((sum,turn,i)=>{
    for(let extra=0;extra<4;extra++) if(isCorrect(turn+extra,i)) return sum+extra;
    return sum;
  },0);
}
function starsFor(attempt){
  const extra=attempt.turns-attempt.minimum;
  const stars=extra<=0?3:extra<=Math.max(2,Math.ceil(attempt.minimum*.25))?2:1;
  return attempt.hinted?Math.min(stars,2):stars;
}
function number(n){return new Intl.NumberFormat(state.lang).format(n);}
let group=state.current===dailyID?groupFor(dailyLevel(localDate())):groupFor(state.current);
let boardDate=null,unlockBanner=null,requested=state.current;

}
function renderPickers(lang,copy,l){
  const picker=$('chapter');

  levelPicker.ariaLabel=l.choose;
  const modeGroups=[document.createElement('optgroup'),document.createElement('optgroup')];
  modeGroups[0].label=copy.chapter;

  for(let i=0;i<chapters.length*2;i++){
    const opt=document.createElement('option');
    const master=i>=chapters.length,chapter=i%chapters.length;
    const stats=chapterStats(chapter,master);
    const lock=!master&&!state.chapters.includes(chapter)?' · '+copy.locked(number(missingStars(chapter))):'';
    opt.value=i;
    opt.textContent=khatti&&innerWidth<=380?chapterName(i,lang)+' · '+number(stats.stars)+'★'+lock:chapterName(i,lang)+' · '+number(stats.stars)+'/'+number(stats.size*3)+' ★'+lock;
    modeGroups[master?1:0].append(opt);
  }
  picker.replaceChildren(...modeGroups);
  picker.value=group;
  const options=levelsInGroup(group).map((id,i)=>{
    const opt=document.createElement('option');
    const master=id>=regularCount,entry=catalog[id%regularCount];
    const stars=master?state.master[id-regularCount]:state.best[id];
    opt.value=id;opt.disabled=!isUnlocked(id);
    const lock=master?copy.locked(number(3-(state.best[id-regularCount]||0))):
      state.chapters.includes(entry.chapter)?copy.previous:copy.locked(number(missingStars(entry.chapter)));
    const suffix=opt.disabled?' · '+lock:stars?' '+'★'.repeat(stars):state.solved.includes(id)?' ✓':'';
    const prefix=master?(state.lang==='ar'?'م · ':'M · '):'';
    opt.textContent=prefix+number(i+1)+' · '+entryName(entry,lang)+suffix;
    return opt;
  });
  if(!levelsInGroup(group).includes(state.current)){
    const placeholder=document.createElement('option');
    placeholder.value='';
    placeholder.disabled=true;
    placeholder.textContent=state.current===dailyID?copy.daily:l.choose;
    options.unshift(placeholder);
  }
  levelPicker.replaceChildren(...options);
  levelPicker.value=levelsInGroup(group).includes(state.current)?state.current:'';
  $('count').textContent=copy.campaign(number(state.solved.length),number(Object.keys(state.master).length),number(regularCount));
}
function localize(){
  const lang=languageCodes.indexOf(state.lang);
  const l=languages[state.lang],r=results[state.lang],copy=extraText[lang];
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';

  $('unlock-banner').hidden=unlockBanner===null;
  $('unlock-banner').textContent=unlockBanner===null?'':copy.unlocked(chapterName(unlockBanner,lang));
  if(!$('finish').hidden)renderCollection();

  $('master-badge').textContent=copy.master;
  $('master-badge').hidden=!master;
  $('caption').classList.toggle('master-caption',master);
  $('name').textContent=state.current<ordinary?levels[state.current].n[lang].replace(/ʾ$/u,''):entryName(active,lang);
  const attempt=state.attempts[state.current];
  $('score').hidden=!won||!attempt;
  if(won&&attempt){
    const index=state.current;
    const stars=index===dailyID?starsFor(attempt):
      index>=regularCount?state.master[index-regularCount]:state.best[index];
    $('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    $('stars').setAttribute('aria-label',r.starRating(number(stars),number(3)));
    $('turns').textContent=copy.turns(number(attempt.turns),number(attempt.minimum));
  }
  $('hint-note').hidden=!attempt?.hinted;
  $('hint-note').textContent=copy.hinted;
  $('hint').disabled=won||!ready;
  $('prompt').textContent=won?(state.current===dailyID?copy.dailyDone:state.solved.length===regularCount?l.all:l.solved):l.prompt;
  pieces.forEach(({x,y,button})=>{button.ariaLabel=l.tile(number(y+1),number(x+1));});
}

function fitBoard(){
  if (!active) return;
  dock.style.height='';
  const styles=getComputedStyle(dock);
  const width=dock.clientWidth-2*parseFloat(styles.paddingLeft);
  const height=dock.clientHeight-2*parseFloat(styles.paddingTop);
  const MIN_TILE=34;
  const size=Math.max(MIN_TILE, Math.floor(Math.min(width/active.w,height/active.h,110)));
  // 34px tiles don't fit the dock (tall boards on short screens): grow the dock; the play view then scrolls
  const need=size*active.h+2*parseFloat(styles.paddingTop);
  if(need>dock.clientHeight+0.5)dock.style.height=Math.ceil(need)+'px';
  board.style.gridTemplateColumns=`repeat(${active.w},${size}px)`;
  board.style.gridTemplateRows=`repeat(${active.h},${size}px)`;
}
async function load(index,restart=false){
  const token=++generation;
  requested=index;
  ready=false;
  clearHint();
  unlockBanner=null;won=false;
  $('restart').disabled=true;
  $('hint').disabled=true;
  $('next').hidden=true;$('score').hidden=true;$('hint-note').hidden=true;
  $('write').hidden=true;$('unlock-banner').hidden=true;
  $('prompt').textContent=extraText[languageCodes.indexOf(state.lang)].loading;
  board.setAttribute('aria-busy','true');
  const today=index===dailyID?localDate():null;
  if(today)refreshDaily(today);
  const id=today?dailyLevel(today):index%regularCount;
  let level,art;
  try{
    if(index<ordinary){
      level={...catalog[id],...levels[id]};
      art=await loadArtwork(id);
    }else{
      level=await generatedLevel(id,index!==dailyID&&index>=regularCount);
      art=await boardArtwork(level);
    }
  }catch{
    if(token!==generation)return;
    $('prompt').textContent=extraText[languageCodes.indexOf(state.lang)].error;
    $('restart').disabled=false;
    board.setAttribute('aria-busy','false');
    return;
  }
  if(token!==generation)return;
  state.current=index;
  boardDate=today;
  group=groupFor(today?id:index);
  active=level;
  const master=active.masterLayout!==undefined;
  dock.classList.toggle('master-board',master);
  if(master)dock.style.setProperty('--master-board-ink-height',active.h*masterTileSize+'px');
  const changedMasterLayout=active.masterLayout && state.attempts[index]?.masterLayout!==active.masterLayout;
  const fresh=restart || changedMasterLayout || state.boards[index]?.length!==active.t.length;
  const deterministic=scrambled(index,today?seedFor(today):undefined,Boolean(today));
  const previousStart=state.attempts[index]?.start || deterministic;
  angle=fresh?(restart&&!today?scrambled(index,1+Math.floor(Math.random()*0xffffffff)):deterministic):
    [...state.boards[index]];
  if(fresh)delete state.attempts[index];
  won=false;
  board.className='board';
  board.replaceChildren();
  cols=active.w;
  colsByPosition = new Map();
  pieces=[];
  for (const [x,y,ports] of active.t) {
    const button=document.createElement('button');
    button.className='cell tile';
    button.type='button';
    button.disabled=true;
    const paint=document.createElement('canvas');
    paint.className='stroke';
    paint.width=paint.height=sourceCell;
    paint.setAttribute('aria-hidden','true');
    button.append(paint);
    const i=pieces.length;
    button.onclick=()=>turn(i);
    colsByPosition.set(y*cols+x,i);
    pieces.push({x,y,ports,button,paint});
  }
  for (let y=0;y<active.h;y++){
    for (let x=0;x<cols;x++){
      const i=colsByPosition.get(y*cols+x);
      const cell=i===undefined?document.createElement('div'):pieces[i].button;
      if(i===undefined) {
        cell.className='cell';
        cell.setAttribute('aria-hidden','true');
      }
      cell.classList.toggle('edge-right',x===cols-1);
      cell.classList.toggle('edge-bottom',y===active.h-1);
      board.append(cell);
    }
  }
  const reveal=document.createElement('canvas');
  reveal.className='reveal';
  reveal.setAttribute('aria-hidden','true');
  reveal.width=cols*sourceCell;
  reveal.height=active.h*sourceCell;
  board.append(reveal);
    for (const [i,piece] of pieces.entries()){
      const {x,y,paint,button}=piece;
      paint.getContext('2d').drawImage(art,x*sourceCell,y*sourceCell,sourceCell,sourceCell,0,0,sourceCell,sourceCell);
      piece.accepts=active.accepts?.[i]||acceptableTurns(paint);
      button.disabled=piece.accepts.every(Boolean);
      if (button.disabled) {
        button.setAttribute('aria-hidden','true');
        angle[i]=0;
      }
    }
    if (fresh) {
      if (angle.every(isCorrect)){
        const i=pieces.findIndex(piece=>!piece.button.disabled);
        if (i>=0) angle[i]=pieces[i].accepts.indexOf(false);
      }
      if (restart && !today && angle.every((turn,i)=>isCorrect(mod4(turn-previousStart[i]),i))){
        const wrong=angle.filter((turn,i)=>!isCorrect(turn,i)).length;
        for (const [i,piece] of pieces.entries()){
          const turn=piece.accepts.findIndex((correct,candidate)=>
            !isCorrect(mod4(candidate-previousStart[i]),i) &&
            (wrong-(isCorrect(angle[i],i)?0:1)>0 || !correct));
          if (turn>=0) {
            angle[i]=turn;
            break;
          }
        }
      }
      const minimum=minimumTurns();
      if (minimum) state.attempts[index]={turns:0,minimum,hinted:false,start:[...angle],...(master?{masterLayout:active.masterLayout}:{})};
    }
    state.boards[index]=[...angle];
    pieces.forEach(({paint},i)=>{paint.style.transform=`rotate(${angle[i]*90}deg)`;});
    const gold=reveal.getContext('2d');
    gold.drawImage(art,0,0);
    gold.globalCompositeOperation='source-in';
    gold.fillStyle='#f9d593';
    gold.fillRect(0,0,reveal.width,reveal.height);
    ready=true;
    board.setAttribute('aria-busy','false');
    $('restart').disabled=false;
    fitBoard();
    updateBoard();
    localize();
    save();
}
function matches(a,b){
  return a.length===b.length && a.every(([from,to],i)=>{
    const [otherFrom,otherTo]=b[b.length-1-i];
    return Math.abs(from-(sourceCell-otherTo))<=3 && Math.abs(to-(sourceCell-otherFrom))<=3;
  });
}
function updateBoard(){
  // Equivalent orientations use canonical edges, including tiny cuts that
  // would otherwise reopen a visually joined stroke after a half-turn.
  const rotation=angle.map((turn,i)=>isCorrect(turn,i)?0:turn%4);
  const connects=pieces.map(({x,y,ports},i)=>{
    let linked=0;
    let open=0;
    directions.forEach(([dx,dy],d)=>{
      const edge=ports[mod4(d-rotation[i])];
      const nx=x+dx,ny=y+dy;
      const j=nx<0 || nx>=cols || ny<0 || ny>=active.h?undefined:colsByPosition.get(ny*cols+nx);
      const opposite=j===undefined?[]:pieces[j].ports[mod4((d+2)%4-rotation[j])];
      if (!matches(edge,opposite)) open++;
      else if (edge.length) linked++;
    });
    pieces[i].button.classList.toggle('linked',open===0 && linked>0);
    return open===0;
  });
  // Oriented artwork resolves decorative details and disconnected Arabic marks
  // that can have multiple valid-looking edge arrangements.
  if (connects.every(Boolean) && angle.every(isCorrect)) finish();
}
function turn(i){
  if (!ready || won || pieces[i].button.disabled) return;
  if (boardDate && boardDate!==localDate()){load(dailyID);return;}
  clearHint();
  $('prompt').textContent=languages[state.lang].prompt;
  angle[i]++;
  const attempt=state.attempts[state.current];
  if (attempt) attempt.turns++;
  pieces[i].paint.style.transform=`rotate(${angle[i]*90}deg)`;
  state.boards[state.current][i]=angle[i]%4;
  updateBoard();
  save();
}
function nextLevel(){
  const index=state.current;
  if(index===dailyID)return null;
  const master=index>=regularCount,offset=master?regularCount:0;
  for(let step=1;step<regularCount;step++){
    const base=(index-offset+step)%regularCount,candidate=base+offset;
    if((master?!state.master[base]:!state.solved.includes(base))&&isUnlocked(candidate))return candidate;
  }
  return null;
}
function finish(){
  if(won)return;
  won=true;
  clearHint();
  const index=state.current,attempt=state.attempts[index];
  if(index===dailyID){
    awardDaily(boardDate);
  }else if(index>=regularCount){
    const id=index-regularCount;
    if(attempt)state.master[id]=Math.max(state.master[id]||0,starsFor(attempt));
  }else{
    if(!state.solved.includes(index))state.solved.push(index);
    if(attempt){
      state.best[index]=Math.max(state.best[index]||0,starsFor(attempt));
      state.bestTurns[index]=Math.min(state.bestTurns[index]??attempt.turns,attempt.turns);
    }
    const before=state.chapters.length;
    updateChapters();
    if(state.chapters.length>before)unlockBanner=state.chapters[before];
  }
  board.classList.add('solved');
  const hadFocus=board.contains(document.activeElement);
  pieces.forEach(({button})=>{button.disabled=true;});
  localize();
  if (hadFocus) (!$('next').hidden?$('next'):!$('collection').hidden?$('collection'):$('restart')).focus({preventScroll:true});
  save();
}
function clearHint(){
  clearTimeout(hintTimer);
  if (highlighted>=0) pieces[highlighted].button.classList.remove('hint');
  highlighted=-1;
}
function hint(){
  if (!ready || won) return;
  if (boardDate && boardDate!==localDate()){load(dailyID);return;}
  const i=angle.findIndex((turn,i)=>!isCorrect(turn,i));
  if (i<0) return;
  clearHint();
  highlighted=i;
  const attempt=state.attempts[state.current];
  if(attempt){
    attempt.hinted=true;
    $('hint-note').hidden=false;
    save();
  }
  const {button,x,y}=pieces[i];
  void button.offsetWidth;
  button.classList.add('hint');
  $('prompt').textContent=languages[state.lang].hinted(number(y+1),number(x+1));
  hintTimer=setTimeout(clearHint,2040);
}
$('language').onchange=event=>{state.lang=event.target.value;localize();save();};
$('chapter').onchange=event=>{
  group=Number(event.target.value);
  const activeHere=levelsInGroup(group).includes(state.current);
  if(activeHere)return;
  const available=levelsInGroup(group).filter(isUnlocked);
  const next=available.find(id=>id>=regularCount?!state.master[id-regularCount]:!state.solved.includes(id))??available[0];
  if(next===undefined)localize();
  else load(next);
};
levelPicker.onchange=event=>{
  const index=Number(event.target.value);
  if(event.target.value!==''&&Number.isInteger(index)&&index>=0&&index<dailyID&&isUnlocked(index))load(index);
};
$('collection').onclick=()=>{
  $('play').hidden=true;
  $('finish').hidden=false;
  renderCollection();
  $('finish-title').focus();
};
$('finish-back').onclick=()=>{
  $('finish').hidden=true;
  $('play').hidden=false;
  fitBoard();
  $('collection').focus({preventScroll:true});
};
$('daily').onclick=()=>{
  $('finish').hidden=true;$('play').hidden=false;
  load(dailyID);
};
$('write').onclick=()=>{
  if(khatti&&won&&active?.letter)window.parent.postMessage({type:'khatti-loop-write',letter:active.letter},'*');
};
$('hint').onclick=hint;
$('restart').onclick=()=>load(requested,true);
$('next').onclick=()=>{
  const next=nextLevel();
  if(next!==null){load(next);levelPicker.focus({preventScroll:true});}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(boardDate&&boardDate!==localDate())load(dailyID);
  refreshDaily();
  syncTop();save();
});
function watchDay(){
  const midnight=new Date();
  midnight.setHours(24,0,0,0);
  setTimeout(()=>{
    if(boardDate&&boardDate!==localDate())load(dailyID);
    refreshDaily();
    syncTop();save();
    watchDay();
  },Math.max(1000,+midnight-Date.now()+50));
}
new ResizeObserver(fitBoard).observe(dock);
let narrowLabels=innerWidth<=380;addEventListener('resize',()=>{const n=innerWidth<=380;if(khatti&&n!==narrowLabels){narrowLabels=n;localize();}});
localize();
load(isUnlocked(state.current)?state.current:0);
watchDay();
