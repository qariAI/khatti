<script type="text/plain" id="harf-regression-tests">/* Run: node harf-regression-tests.cjs path/to/Harf-Writer.html

{
const fs=require('fs'),vm=require('vm'),assert=require('assert');const html=fs.readFileSync(process.argv[2]||'Harf-Writer-v5-Complete-Ayahs.html','utf8');vm.runInThisContext(html.match(/<script id="harf-engine">([\s\S]*?)<\/script>/)[1]);const E=HarfEngine,data=JSON.parse(html.match(/<script type="application\/json" id="harf-lesson-data">([\s\S]*?)<\/script>/)[1]),LESSONS=data.lessons,Q_LESSONS=LESSONS.filter(l=>data.bismIds.includes(l.id)),ALLAH_LESSONS=LESSONS.filter(l=>data.allahIds.includes(l.id));
const marks=[Q_LESSONS.at(-1).strokes.find(s=>s.id==='sin-sukun'),...ALLAH_LESSONS.at(-1).strokes.filter(s=>['shadda','dagger-alif'].includes(s.id))],center=p=>({x:p.reduce((a,p)=>a+p.x,0)/p.length,y:p.reduce((a,p)=>a+p.y,0)/p.length});let checks=0;const check=(v,msg)=>{assert(v,msg);checks++;};
for(const input of ['touch','pen'])for(const target of marks){check(E.strokeMetric({points:target.points},target,38,input).qualified,input+' exact '+target.id);for(const source of marks){if(source===target)continue;const a=center(source.points),b=center(target.points),points=source.points.map(p=>({x:p.x-a.x+b.x,y:p.y-a.y+b.y}));check(!E.strokeMetric({points},target,38,input).qualified,input+' rejects centered '+source.id+' as '+target.id);check(!E.strokeMetric({points:source.points},target,38,input).qualified,input+' rejects original '+source.id+' as '+target.id);}}
for(const target of marks){const jitter=target.points.map((p,i,all)=>({x:p.x+2*Math.sin(i/(all.length-1)*Math.PI*8),y:p.y+2*Math.sin(i/(all.length-1)*Math.PI*6)}));check(E.strokeMetric({points:jitter},target,38,'touch').qualified,'small wobble '+target.id);check(!E.strokeMetric({points:target.points.slice(0,Math.floor(target.points.length*.4))},target,38,'touch').qualified,'partial '+target.id);check(!E.strokeMetric({points:target.points.slice().reverse()},target,38,'touch').qualified,'reverse '+target.id);}
const sukun=marks[0],c=center(sukun.points);const wobble=Array.from({length:60},(_,i)=>({x:c.x-22+i*.75,y:c.y+4*Math.sin(i*.6)}));check(!E.strokeMetric({points:wobble},sukun,38,'touch').qualified,'wobbly line cannot be sukun');for(const l of [...Q_LESSONS,...ALLAH_LESSONS])check(E.evaluate(l.strokes.map(s=>({points:s.points})),l,'touch').qualified,'full model '+l.id);const allah=ALLAH_LESSONS.at(-1),a=allah.strokes.map(s=>({points:s.points})),si=allah.strokes.findIndex(s=>s.id==='shadda'),di=allah.strokes.findIndex(s=>s.id==='dagger-alif');a[si]=a[di];check(!E.evaluate(a,allah,'touch').qualified,'dagger cannot replace shadda under free mark order');check(allah.variants.every(v=>E.evaluate(v.map(id=>({points:allah.strokes.find(s=>s.id===id).points})),allah,'touch').qualified),'all legitimate free mark orders accepted');console.log(checks+' synthetic mark/lesson checks passed. No recorded-device calibration is claimed.');

function harness(cap=Infinity){const data=new Map(),store={get length(){return data.size},key:i=>[...data.keys()][i],getItem:k=>data.get(k)||null,setItem(k,v){let bytes=2*(k.length+v.length);for(const [x,y]of data)if(x!==k)bytes+=2*(x.length+y.length);if(bytes>cap)throw new DOMException('quota','QuotaExceededError');data.set(k,v);}};return new Function('localStorage','data',`let gallery=[];const sessionWrites=new Map(),unsavedKeys=new Set();function storageNotice(){};function toast(){};${helpers};return {write:tryPersistentWrite,seed:g=>{gallery=g;data.set('harf.standalone.v1.gallery',JSON.stringify(g));},getGallery:()=>gallery,evictions:()=>storageEvictions,read:k=>data.get('harf.standalone.v1.'+k),bytes:()=>ownedStorageBytes(new Map())};`)(store,data);}

h=harness(1600000);h.seed([make('oldest',350000)]);h.write('gallery',[make('newest',350000),make('recent',350000),make('oldest',350000)]);assert.deepStrictEqual(h.getGallery().map(x=>x.id),['newest','recent']);assert.equal(h.evictions(),1);
h=harness();h.seed(['newest','recent','older','oldest'].map(id=>make(id,250000)));h.write('draft.sample.trace',{payload:'x'.repeat(750000)});assert(h.getGallery().length<4);assert.equal(h.getGallery()[0].id,'newest');assert(h.read('draft.sample.trace'));assert(h.bytes()<=3*1024*1024);
h=harness();const previous=[make('saved',1000)];h.seed(previous);assert.throws(()=>h.write('gallery',[make('too-large',2000000),...previous]));assert.deepStrictEqual(JSON.parse(h.read('gallery')).map(a=>a.id),['saved']);
